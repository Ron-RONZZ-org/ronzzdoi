name: Deploy ronzzdoi
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 158.178.193.231
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo -u ronzz git -C /opt/ronzzdoi pull origin main
            sudo -u ronzz HOME=/opt/ronzzdoi sh -c 'cd /opt/ronzzdoi && uv sync --extra public --no-dev'
            sudo systemctl restart ronzzdoi ronzzdoi-internal
            sleep 2
            sudo systemctl status ronzzdoi ronzzdoi-internal --no-pager | head -10
            echo "=== Deploy OK ==="
