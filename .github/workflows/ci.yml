name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Ruff check
        run: uvx ruff check .
      - name: Ruff format check
        run: uvx ruff format --check .

  test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Clone sibling dependencies
        run: |
          git clone --depth 1 https://github.com/Ron-RONZZ-org/lightercore.git ../lightercore
          git clone --depth 1 https://github.com/Ron-RONZZ-org/lighterauth.git ../lighterauth
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Create venv + install deps
        run: |
          uv venv
          uv pip install -e "../lightercore" -e "../lighterauth" -e ".[dev]"
      - name: Run pytest
        run: uv run --no-sync pytest tests/ -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Clone lightercore (for @lightercore/ui)
        run: |
          git clone --depth 1 https://github.com/Ron-RONZZ-org/lightercore.git ../lightercore
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend deps
        working-directory: web
        run: npm ci
      - name: Vitest
        working-directory: web
        run: npm run test
      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Clone sibling dependencies
        run: |
          git clone --depth 1 https://github.com/Ron-RONZZ-org/lightercore.git ../lightercore
          git clone --depth 1 https://github.com/Ron-RONZZ-org/lighterauth.git ../lighterauth
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Create venv + install deps
        run: |
          uv venv
          uv pip install -e "../lightercore" -e "../lighterauth" -e ".[dev]"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend deps
        working-directory: web
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps
      - name: Start backend + frontend
        run: |
          set -e
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          # Seed the dev database and capture the admin key from output.
          rm -rf /tmp/ronzzdoi-ci
          setsid .venv/bin/ronzzdoi-dev --data-dir /tmp/ronzzdoi-ci --seed > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8011/api/health && break
            sleep 1
          done
          API_KEY=$(grep -oP 'Admin API key:\s+\K\S+' /tmp/backend.log | head -1)
          echo "Admin key: ${API_KEY:0:12}..."
          cd web
          setsid npm run dev > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:6025/ && break
            sleep 1
          done
          echo "backend=$BACKEND_PID frontend=$FRONTEND_PID" > /tmp/pids.txt
          echo "API_KEY=$API_KEY" > /tmp/apikey.txt
      - name: Run E2E smoke test
        run: |
          set -e
          API_KEY=$(grep 'API_KEY=' /tmp/apikey.txt | cut -d= -f2)
          CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -name chrome -path "*chrome-linux64*" | head -1)
          echo "Using chromium: $CHROME_PATH"
          RONZZDOI_API_KEY="$API_KEY" \
          FRONTEND_URL=http://127.0.0.1:6025 \
          CHROME_PATH="$CHROME_PATH" \
          node tests/e2e_gui_smoke.mjs
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
