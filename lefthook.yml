# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# NOTE: ruff commands go through scripts/lint.sh, NOT `uv run ruff` —
# `uv run` cannot resolve sibling dependencies (../lighterauth) inside a
# git worktree, so the hook would always fail there.  lint.sh resolves the
# main checkout's .venv and runs its ruff binary directly.

pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: '**/*.py'
      run: bash scripts/lint.sh check {staged_files}
      fail_text: |
        ❌ Ruff linting failed!
        Run 'bash scripts/lint.sh check {staged_files}' for details.
    ruff-format:
      glob: '**/*.py'
      run: bash scripts/lint.sh format {staged_files}
      fail_text: |
        ❌ Ruff formatting check failed!
        Run 'bash scripts/lint.sh format {staged_files}' to fix.
    bash-syntax:
      glob: '**/*.sh'
      run: bash -n {staged_files}
      fail_text: |
        ❌ Shell script syntax error detected.
        Run 'bash -n <file>' to see the error, then fix it.
